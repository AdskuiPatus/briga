<svg xmlns="http://www.w3.org/2000/svg" viewBox="14 22 204 160"
     width="204" height="160" role="img" aria-label="SDA Patus">
  <defs>
    <linearGradient id="neon" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#25e0f5"/>
      <stop offset=".40" stop-color="#4f8bff"/>
      <stop offset=".72" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#ea33e6"/>
    </linearGradient>
    <filter id="glow" x="-45%" y="-45%" width="190%" height="190%">
      <feGaussianBlur stdDeviation="2.3" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- буквы SDA: тёмно-синий монолинейный контур -->
  <g fill="none" stroke="#13264a" stroke-width="13"
     stroke-linecap="round" stroke-linejoin="round">
    <!-- S -->
    <path d="M56 53 C56 41 34 41 34 57 C34 71 52 75 52 87 C52 103 32 103 32 117"/>
    <!-- D -->
    <path d="M82 44 V122 M82 44 H100 C124 44 128 60 128 83 C128 106 124 122 100 122 H82"/>
    <!-- A -->
    <path d="M150 122 L172 44 L194 122"/>
    <path d="M158 98 H186"/>
  </g>

  <!-- неоновая цепь поверх букв -->
  <g filter="url(#glow)" fill="none" stroke="url(#neon)" stroke-width="2.6"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M50 55 C50 47 39 47 39 58 C39 70 47 74 47 85 C47 99 38 99 38 112"/>  <!-- след по S -->
    <path d="M96 106 V58 H112"/>       <!-- след по D -->
    <path d="M158 112 L172 56 L186 112"/>  <!-- след по A -->
    <path d="M150 88 C150 32 206 32 206 88"/>  <!-- петля над A -->
  </g>

  <!-- узлы цепи -->
  <g filter="url(#glow)" fill="#13264a" stroke="url(#neon)" stroke-width="2.3">
    <circle cx="50"  cy="55"  r="4.2"/>
    <circle cx="38"  cy="112" r="4.2"/>
    <circle cx="96"  cy="106" r="4.2"/>
    <circle cx="112" cy="58"  r="4.2"/>
    <circle cx="172" cy="56"  r="4.2"/>
    <circle cx="150" cy="88"  r="4.2"/>
    <circle cx="206" cy="88"  r="4.2"/>
  </g>

  <!-- подпись -->
  <text x="115" y="164" text-anchor="middle"
        font-family="'Segoe UI', system-ui, -apple-system, sans-serif"
        font-size="36" font-weight="500" fill="#13264a"
        letter-spacing="1.5">Patus</text>
</svg>
